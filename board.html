<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mission Control</title>
<!--
  Mission Control — a dependency-aware, owner-vs-agent task board. Zero-build,
  zero-dependency, single file. Open directly (open board.html) or serve (npx serve .).

  HOW TO REUSE: everything project-specific lives in the JSON in <script id="seed"> below —
  a `config` block (board name, the two lanes' labels/colors, the terminus) plus `tracks`
  and `tasks`. Copy this file into a project, edit the seed, done. The engine (this <style>,
  the map module, and the main <script>) is generic and never needs editing.

  Three views:
    LANE A / LANE B: each owner's full plate in one list: UP NOW (unblocked, tap the ring
    to complete), WAITING (blocked, names its blocker), DONE (collapsed).
    MAP: the project as a transit map — one line per track converging on the terminus,
    each line's current bottleneck pulsing.

  "Ready" is derived, never stored: a task is blocked until all of its `deps` are done.
  In-browser taps persist per device (localStorage DELTAS over the seed, so new seeds merge
  cleanly). "Sync" exports a compact changelog to paste back into the seed. See README.md.
-->
<style>
  :root {
    /* ground + ink (navy-biased neutrals, not grey) */
    --bg: #0B1020; --bg-raise: #131A2C; --bg-card: #171F34; --bg-sunk: #0D1322;
    --ink: #EAF0FA; --ink-dim: #8B95AC; --ink-faint: #5A6784;
    --line: #222C44; --line-strong: #2E3A58;
    /* lane (owner) colors — JS overrides these from the seed's config.lanes at boot */
    --lane-a: #FFB020; --lane-b: #45E0FF; --ext: #8B95AC;
    --ok: #3ECF8E; --halo: #45E0FF;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.25);
    --r: 14px;
  }
  :root[data-theme="light"] {
    --bg: #F2F5FA; --bg-raise: #FFFFFF; --bg-card: #FFFFFF; --bg-sunk: #E8EDF5;
    --ink: #16213C; --ink-dim: #5A6784; --ink-faint: #97A2B8;
    --line: #DCE3EF; --line-strong: #C4CEE0;
    --ext: #7A8499;
    --ok: #149467; --halo: #0899C4;
    --shadow: 0 1px 2px rgba(22,33,60,.08), 0 6px 20px rgba(22,33,60,.08);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F2F5FA; --bg-raise: #FFFFFF; --bg-card: #FFFFFF; --bg-sunk: #E8EDF5;
      --ink: #16213C; --ink-dim: #5A6784; --ink-faint: #97A2B8;
      --line: #DCE3EF; --line-strong: #C4CEE0;
      --ext: #7A8499;
      --ok: #149467; --halo: #0899C4;
      --shadow: 0 1px 2px rgba(22,33,60,.08), 0 6px 20px rgba(22,33,60,.08);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.45 "Avenir Next", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 28px;
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: saturate(1.3) blur(10px);
    padding: calc(10px + env(safe-area-inset-top)) 16px 0;
    border-bottom: 1px solid var(--line);
  }
  .hd-row { display: flex; align-items: center; gap: 10px; max-width: 760px; margin: 0 auto; }
  .wordmark { font-weight: 800; font-size: 16px; letter-spacing: .12em; }
  .wordmark .accent { color: var(--halo); }
  .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .14em; color: var(--ink-faint); text-transform: uppercase; margin-top: 1px; }
  .hd-spacer { margin-left: auto; }
  .hd-btn {
    font-size: 12.5px; font-weight: 650; padding: 7px 13px; border-radius: 999px;
    border: 1px solid var(--line-strong); color: var(--ink-dim); transition: .15s;
  }
  .hd-btn:active { transform: scale(.96); }
  .hd-btn.sync-live { color: var(--bg); background: var(--halo); border-color: var(--halo); box-shadow: 0 0 14px color-mix(in srgb, var(--halo) 45%, transparent); }
  /* per-line progress */
  .progress { display: flex; gap: 4px; max-width: 760px; margin: 10px auto 0; padding-bottom: 10px; }
  .progress .seg { flex: 1; height: 4px; border-radius: 2px; background: var(--bg-sunk); overflow: hidden; }
  .progress .seg i { display: block; height: 100%; border-radius: 2px; background: var(--c); width: 0%; transition: width .6s cubic-bezier(.22,1,.36,1); }

  /* ---------- views ---------- */
  main { max-width: 760px; margin: 0 auto; padding: 14px 14px 20px; }
  .view { display: none; }
  /* entrance animates transform only — never opacity (a frozen animation clock must not blank the view) */
  .view.on { display: block; animation: viewin .22s ease; }
  @keyframes viewin { from { transform: translateY(6px); } to { transform: none; } }

  .plate-head { display: flex; align-items: baseline; gap: 10px; margin: 4px 2px 14px; }
  .plate-head h2 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.01em; }
  .plate-head .sub { color: var(--ink-dim); font-size: 12.5px; }

  .sect { margin-bottom: 22px; }
  .sect-head { display: flex; align-items: center; gap: 8px; margin: 0 2px 9px; }
  .sect-head .t { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
  .sect-head .n { font-size: 11px; font-weight: 700; color: var(--ink-faint); background: var(--bg-sunk); border-radius: 999px; padding: 1px 8px; }
  .sect-head.up .t { color: var(--halo); }
  .sect-head button.tgl { margin-left: auto; color: var(--ink-faint); font-size: 12px; padding: 4px 8px; }

  /* ---------- cards ---------- */
  .card {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 13px 13px 13px 11px; margin-bottom: 9px; box-shadow: var(--shadow);
    position: relative; overflow: hidden; transition: opacity .3s, transform .3s;
  }
  .card .rail { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--tc); opacity: .9; }
  .card.is-blocked { opacity: .62; box-shadow: none; }
  .card.is-blocked .rail { opacity: .35; }
  .card.is-done { opacity: .78; }
  .card.just-unblocked { animation: unblock .9s cubic-bezier(.22,1,.36,1); }
  @keyframes unblock {
    0% { transform: translateY(10px); box-shadow: 0 0 0 0 color-mix(in srgb, var(--halo) 55%, transparent); }
    45% { box-shadow: 0 0 22px 4px color-mix(in srgb, var(--halo) 45%, transparent); }
    100% { transform: none; }
  }
  /* completion ring — the tap target */
  .ring {
    flex: none; width: 44px; height: 44px; margin: -4px 0 -4px -2px;
    display: grid; place-items: center; border-radius: 50%; position: relative;
  }
  .ring .c {
    width: 27px; height: 27px; border-radius: 50%;
    border: 2.5px solid var(--tc); background: transparent;
    display: grid; place-items: center; transition: .18s;
    color: transparent; font-size: 14px; font-weight: 800;
  }
  .ring:active .c { transform: scale(.85); }
  .is-done .ring .c { background: var(--tc); color: var(--bg); border-color: var(--tc); }
  .is-blocked .ring .c { border-color: var(--line-strong); border-style: dashed; }
  .is-blocked .ring .c::after { content: "🔒"; font-size: 11px; }
  .ring.ext-wait .c { border-style: dotted; border-color: var(--ext); animation: extpulse 2.4s ease-in-out infinite; }
  .ring.ext-wait .c::after { content: "⧗"; color: var(--ext); font-size: 13px; }
  @keyframes extpulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ext) 40%, transparent);} 50% { box-shadow: 0 0 0 7px transparent; } }
  /* confetti burst on complete */
  .ring .burst { position: absolute; inset: 0; pointer-events: none; }
  .ring .burst i { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; border-radius: 2px; background: var(--tc); opacity: 0; }
  .popping .burst i { animation: pop .55s ease-out forwards; }
  @keyframes pop {
    0% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.4); }
  }
  .card-main { flex: 1; min-width: 0; }
  .card-title { font-weight: 650; font-size: 14.5px; letter-spacing: -.005em; }
  .is-done .card-title { text-decoration: line-through; text-decoration-color: var(--ink-faint); text-decoration-thickness: 1.5px; }
  .card-detail { color: var(--ink-dim); font-size: 12.5px; margin-top: 3px; }
  .card-meta { display: flex; align-items: center; gap: 8px; margin-top: 7px; flex-wrap: wrap; }
  .lchip { font-size: 10.5px; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; color: var(--tc); }
  .lchip::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--tc); margin-right: 5px; vertical-align: 1px; }
  .pri-hi { font-size: 10.5px; font-weight: 800; color: #FF6B6B; letter-spacing: .04em; }
  .doing { font-size: 10.5px; font-weight: 700; color: var(--halo); }
  .doing::before { content: "◐ "; animation: spin 1.6s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .blockedby { font-size: 11.5px; color: var(--ink-faint); }
  .blockedby b { color: var(--ink-dim); font-weight: 650; }
  .card a.ref { font-size: 11.5px; color: var(--ink-faint); text-decoration: none; margin-left: auto; flex: none; }
  .card a.ref:hover { color: var(--halo); }
  .empty-note {
    text-align: center; color: var(--ink-faint); font-size: 13px; padding: 18px 10px;
    border: 1.5px dashed var(--line); border-radius: var(--r);
  }

  /* ---------- map view ---------- */
  /* ---------- map: network view (SVG metro) + view switch ---------- */
  .map-switch-row { display: flex; align-items: center; gap: 8px; margin: 2px 0 10px; }
  .map-switch { display: flex; gap: 4px; background: var(--bg-sunk); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .map-switch button { font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 999px; color: var(--ink-faint); transition: .15s; }
  .map-switch button.on { background: var(--bg-card); color: var(--ink); box-shadow: var(--shadow); }
  .net-zoom { margin-left: auto; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--ink-dim); background: var(--bg-raise); }
  #netHost { margin: 0 -14px; }
  /* label-set swap: overview (fitted) shows big keywords, 1:1 shows full labels */
  #netHost:not(.fitted) .nb-lbl-short, #netHost:not(.fitted) .nb-title-short { display: none; }
  #netHost.fitted .nb-lbl-full, #netHost.fitted .nb-title-full { display: none; }
  /* phone fit-scale is ~0.33 (1200px net / ~390px view): bump keyword sizes so they land ~11-13px on screen */
  #netHost.fitted text.nb-lbl-short { font-size: 24px; }
  #netHost.fitted text.nb-title-short { font-size: 26px; letter-spacing: .02em; }

  /* ---------- map: one line per card, stations as rows — labels can never overlap ---------- */
  #mapHost { margin-top: 4px; }
  .line-block { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 13px 14px 7px; margin-bottom: 13px; }
  .line-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; min-width: 0; }
  .line-head .nm { flex: none; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--tc); }
  .line-head .prog { font-size: 11.5px; color: var(--ink-faint); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stn { display: flex; align-items: flex-start; gap: 10px; position: relative; padding: 8px 0; }
  .stn .seg { position: absolute; left: 20px; top: 0; bottom: 0; width: 4px; border-radius: 2px; background: var(--tc); opacity: .18; }
  .stn.is-done .seg { opacity: .9; }
  .stn:first-child .seg { top: 14px; }
  .stn:last-child .seg { bottom: auto; height: 22px; }
  .stn .disc { flex: none; width: 44px; height: 44px; margin: -6px 0; display: grid; place-items: center; position: relative; z-index: 1; }
  .stn .disc .d { width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--bg-card); border: 3px solid var(--tc); color: transparent; transition: .15s; }
  .stn .disc:active .d { transform: scale(.85); }
  .stn.is-done .disc .d { background: var(--tc); color: var(--bg); }
  .stn.is-ready .disc .d { box-shadow: 0 0 12px color-mix(in srgb, var(--tc) 60%, transparent); }
  .stn.is-blocked .disc .d { border: 2px dashed var(--line-strong); color: var(--ink-faint); font-size: 10px; }
  .stn.is-ext .disc .d { border-style: dotted; border-color: var(--ext); color: var(--ext); font-size: 12px; }
  .stn.here .disc::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; border: 2px solid var(--tc); animation: herepulse 2s ease-out infinite; pointer-events: none; }
  @keyframes herepulse { 0% { transform: scale(.65); opacity: .9; } 100% { transform: scale(1.3); opacity: 0; } }
  .stn .body { flex: 1; min-width: 0; padding-top: 2px; }
  .stn .t { font-size: 14px; font-weight: 650; }
  .stn.is-blocked .t { opacity: .55; }
  .stn.is-done .t { opacity: .72; text-decoration: line-through; text-decoration-color: var(--ink-faint); }
  .stn .own { font-size: 9.5px; font-weight: 800; letter-spacing: .04em; border-radius: 5px; padding: 1.5px 5px; margin-left: 7px; vertical-align: 1.5px; color: var(--oc); border: 1px solid color-mix(in srgb, var(--oc) 45%, transparent); }
  .depchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .depchip { font-size: 10.5px; font-weight: 650; color: var(--dc); background: color-mix(in srgb, var(--dc) 12%, transparent); border: 1px solid color-mix(in srgb, var(--dc) 35%, transparent); border-radius: 999px; padding: 2.5px 9px; }
  .stn.flash { animation: unblock .9s cubic-bezier(.22,1,.36,1); }
  .terminus { padding-top: 12px; }
  .terminus .disc .d { width: 34px; height: 34px; border-width: 4px; border-style: double; }
  .terminus.is-blocked .disc .d { border: 4px double var(--line-strong); }
  .terminus .t { font-size: 16px; font-weight: 800; letter-spacing: .04em; }
  .conv { display: flex; gap: 5px; margin-bottom: 3px; }
  .conv i { width: 15px; height: 3px; border-radius: 2px; background: var(--c); }
  .map-hint { color: var(--ink-faint); font-size: 12px; text-align: center; margin: 6px 0 2px; }
  .map-legend { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 10px 0 2px; font-size: 11px; color: var(--ink-dim); }
  .map-legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; background: var(--c); }
  .map-legend .hollow::before { background: transparent; border: 2px solid var(--c); width: 7px; height: 7px; }

  /* ---------- tab bar — lives in the header; the host app's floating buttons own the bottom of the screen ---------- */
  nav.tabs {
    display: flex; justify-content: center; gap: 6px;
    max-width: 760px; margin: 4px auto 0; padding-bottom: 10px;
  }
  .tab {
    flex: 1; max-width: 180px; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 7px 4px 6px; border-radius: 12px; color: var(--ink-faint); transition: .15s;
    font-size: 11px; font-weight: 700; letter-spacing: .06em;
  }
  .tab .ic { font-size: 19px; line-height: 1; }
  .tab.on { color: var(--ink); background: var(--bg-sunk); }
  .tab.on.t-lane-a { color: var(--lane-a); } .tab.on.t-lane-b { color: var(--lane-b); } .tab.on.t-map { color: var(--halo); }
  .tab .bdg {
    position: absolute; transform: translate(14px, -4px);
    min-width: 17px; height: 17px; border-radius: 9px; padding: 0 4px;
    background: var(--bc); color: var(--bg); font-size: 10.5px; font-weight: 800;
    display: grid; place-items: center;
  }
  .tab { position: relative; }

  /* ---------- toast + sheet ---------- */
  .toast {
    position: fixed; top: calc(env(safe-area-inset-top) + 12px); left: 50%; z-index: 70;
    transform: translateX(-50%) translateY(-16px);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 650; box-shadow: var(--shadow);
    opacity: 0; transition: .25s cubic-bezier(.22,1,.36,1); pointer-events: none; z-index: 50;
    max-width: 88vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .un { color: var(--halo); }

  .scrim { position: fixed; inset: 0; background: rgba(4,7,14,.55); z-index: 60; display: none; align-items: flex-end; justify-content: center; }
  .scrim.show { display: flex; }
  .sheet {
    background: var(--bg-raise); border: 1px solid var(--line); border-bottom: 0;
    border-radius: 20px 20px 0 0; width: 100%; max-width: 560px;
    padding: 16px 18px calc(18px + env(safe-area-inset-bottom));
    animation: sheetup .25s cubic-bezier(.22,1,.36,1);
  }
  @keyframes sheetup { from { transform: translateY(40px); opacity: .5; } }
  .sheet h3 { margin: 0 0 12px; font-size: 15px; font-weight: 750; }
  .sheet .f { margin-bottom: 10px; }
  .sheet label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 4px; }
  .sheet input, .sheet select, .sheet textarea {
    width: 100%; font: inherit; font-size: 14px; color: var(--ink);
    background: var(--bg-sunk); border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 11px; outline: none;
  }
  .sheet input:focus, .sheet select:focus, .sheet textarea:focus { border-color: var(--halo); }
  .sheet .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sheet .acts { display: flex; gap: 10px; margin-top: 14px; }
  .sheet .acts button { flex: 1; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 14px; }
  .sheet .go { background: var(--halo); color: var(--bg); }
  .sheet .quiet { background: var(--bg-sunk); color: var(--ink-dim); }
  .sheet textarea.syncbox { font-family: ui-monospace, monospace; font-size: 11px; min-height: 110px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  .hd-tabs .tab .ic { font-size: 15px; }
</style>
</head>
<body>

<header>
  <div class="hd-row">
    <div>
      <div class="wordmark" id="wordmark"></div>
      <div class="eyebrow" id="eyebrow"></div>
    </div>
    <span class="hd-spacer"></span>
    <button class="hd-btn" id="themeBtn" aria-label="Toggle theme">◐</button>
    <button class="hd-btn" id="syncBtn">Sync</button>
  </div>
  <div class="progress" id="progress" aria-label="Progress by line"></div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main>
  <!-- the two lane views (id="view-<laneId>") are injected here at boot from config.lanes -->
  <section class="view" id="view-map" aria-label="Project map">
    <div class="map-legend">
      <span style="--c:var(--ok)">done</span>
      <span class="hollow" style="--c:var(--halo)">ready — act now</span>
      <span class="hollow" style="--c:var(--ink-faint)">blocked</span>
      <span style="--c:var(--ext)">⧗ waiting on the world</span>
    </div>
    <div class="map-switch-row">
      <div class="map-switch" id="mapSwitch">
        <button data-mv="network" class="on">◈ Network</button>
        <button data-mv="lines">≣ Lines</button>
      </div>
      <button id="netZoomBtn" class="net-zoom">🔍 Zoom</button>
    </div>
    <div id="netHost"></div>
    <div id="linesHost" style="display:none"></div>
    <p class="map-hint" id="mapHint">The whole network · tap a station to zoom in on it</p>
  </section>
</main>


<div class="toast" id="toast" role="status"></div>

<div class="scrim" id="scrim">
  <div class="sheet" id="sheet"></div>
</div>

<!-- Schema: { config:{…}, rev, updated, tracks:[…], tasks:[…] }. See README.md for the full shape. -->
<script id="seed" type="application/json">
{

    "title": "Mission Control — Demo",
    "wordmarkHTML": "MISSION<span class=\"accent\">CONTROL</span>",

    "lanes": [

      { "id": "agent", "label": "AGENT", "name": "Agent", "subtitle": "the assistant's plate",       "glyph": "A", "color": "#45E0FF" }
    ],
    "ext": { "label": "WORLD", "glyph": "⧗", "color": "#8B95AC" },
    "terminusMessage": "🎉🎉 LAUNCHED 🎉🎉"

  "tracks": [
    { "id": "build",  "name": "Build",  "color": "#F472B6" },
    { "id": "infra",  "name": "Infra",  "color": "#3ECF8E" },
    { "id": "launch", "name": "Launch", "color": "#A78BFA" },
    { "id": "growth", "name": "Growth", "color": "#FF6B6B" }

 *  2. Each track is a lane; its vertical line + station discs sit near the lane's LEFT edge

 *  4. the terminus task (the one flagged `terminus:true`) is forced below every other station.
 *  5. Each track's line is solid through its DONE prefix, 25% opacity beyond the frontier.
 *  6. Cross-track deps become cubic-bezier connectors in the dep's color, dot at the dependent end.

 *  - 0/undefined => single row (all lanes side by side, unchanged).
 *  - N>0 => lanes wrap into rows of at most N: track i -> col=i%N, row=floor(i/N).
 *    x uses col; y keeps the task's GLOBAL topo depth (not rebased) plus row*rowHeight, so a
 *    late-starting lane keeps its meaningful empty top. Every row is the SAME height; svg

 *  - every station renders .nb-lbl-full (1–2 wrapped lines, 12px) AND .nb-lbl-short

        }

      destroy: function () { while (hostEl.firstChild) hostEl.removeChild(hostEl.firstChild); groups = {}; positions = {}; }

  /* ---------- config: two lanes + world + terminus, all from the seed ---------- */
  var LANES = (cfg.lanes && cfg.lanes.length >= 2) ? cfg.lanes : [
    { id: "me",    label: "ME",    name: "Me",    subtitle: "your whole plate, one list", glyph: "M", color: "#FFB020", world: true },
    { id: "agent", label: "AGENT", name: "Agent", subtitle: "the agent's plate",          glyph: "A", color: "#45E0FF" }
  ];
  var LANE_A = LANES[0], LANE_B = LANES[1];
  var laneById = {}; LANES.forEach(function (l) { laneById[l.id] = l; });
  // "ext" is the reserved owner id for the outside world (carrier vetting, a number arriving…).
  var EXT = cfg.ext || { label: "WORLD", glyph: "⧗", color: "#8B95AC" };
  // ext tasks surface on whichever lane is the human interface to the world (defaults to lane A).
  var WORLD_LANE = LANES.filter(function (l) { return l.world; })[0] || LANE_A;
  // the terminus task (the "GO LIVE" node), if any — flagged terminus:true in the seed.
  var TERMINUS_ID = (seed.tasks.filter(function (t) { return t.terminus; })[0] || {}).id || null;

  // storage + sync keys are namespaced by boardId so multiple boards don't collide on one device.
  var BID = String(cfg.boardId || "board").replace(/[^a-z0-9-]/gi, "").toLowerCase() || "board";
  var LS = BID + "-mc", THEME = BID + "-theme", MAPVIEWKEY = BID + "-mapview";

  // paint lane/world colors into the CSS custom properties the stylesheet reads.
  var rootStyle = document.documentElement.style;
  rootStyle.setProperty("--lane-a", LANE_A.color || "#FFB020");
  rootStyle.setProperty("--lane-b", LANE_B.color || "#45E0FF");
  rootStyle.setProperty("--ext", EXT.color || "#8B95AC");

  // header + title, from config.
  document.title = cfg.title || "Mission Control";
  (function () {
    var wm = document.getElementById("wordmark");
    if (cfg.wordmarkHTML) wm.innerHTML = cfg.wordmarkHTML;   // opt-in: mark an accent span with class="accent"
    else wm.textContent = cfg.wordmark || "MISSION CONTROL";
    document.getElementById("eyebrow").textContent = cfg.eyebrow || "";
  })();

  // inject the two lane views (id="view-<laneId>") ahead of the static map view.
  (function () {
    var mainEl = document.querySelector("main"), mapEl = document.getElementById("view-map");
    LANES.forEach(function (l) {
      var s = document.createElement("section");
      s.className = "view"; s.id = "view-" + l.id;
      s.setAttribute("aria-label", (l.name || l.label || l.id) + " tasks");
      mainEl.insertBefore(s, mapEl);
    });
  })();

  /* ---------- state: seed + delta overlay ---------- */
  function loadDeltas() {
    try { var d = JSON.parse(localStorage.getItem(LS) || "{}"); return { statusOverride: d.statusOverride || {}, added: d.added || [], removed: d.removed || [] }; }
    catch (e) { return { statusOverride: {}, added: [], removed: [] }; }
  }
  var deltas = loadDeltas();
  function saveDeltas() { try { localStorage.setItem(LS, JSON.stringify(deltas)); } catch (e) {} syncBadge(); }

  function tasks() { // seed + overlay, self-cleaning
    var byId = {};
    var list = seed.tasks
      .filter(function (t) { return deltas.removed.indexOf(t.id) === -1; })
      .map(function (t) {
        var o = Object.assign({}, t);
        var ov = deltas.statusOverride[t.id];
        if (ov !== undefined) {
          if (ov === t.status) delete deltas.statusOverride[t.id]; // seed caught up — clean
          else o.status = ov;
        }
        return o;
      })
      .concat(deltas.added.map(function (t) {
        var o = Object.assign({}, t);
        var ov = deltas.statusOverride[t.id];
        if (ov !== undefined) o.status = ov;
        return o;
      }));
    list.forEach(function (t) { byId[t.id] = t; });
    list.forEach(function (t) {
      t.blockers = (t.deps || []).filter(function (d) { return byId[d] && byId[d].status !== "done"; });
      t.state = t.status === "done" ? "done" : (t.blockers.length ? "blocked" : "ready");
    });
    return { list: list, byId: byId };
  }
  function isDirty() { return Object.keys(deltas.statusOverride).length || deltas.added.length || deltas.removed.length; }

  var trackById = {};
  seed.tracks.forEach(function (tr) { trackById[tr.id] = tr; });

  /* ---------- views ---------- */
  var currentView = LANE_A.id;
  var TABS = [
    { id: LANE_A.id, label: LANE_A.label, ic: LANE_A.icon || "☑", cls: "t-lane-a", bc: "var(--lane-a)" },
    { id: LANE_B.id, label: LANE_B.label, ic: LANE_B.icon || "✦", cls: "t-lane-b", bc: "var(--lane-b)" },
    { id: "map", label: cfg.mapLabel || "MAP", ic: "◈", cls: "t-map", bc: "var(--halo)" }
  ];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function readyCount(owner) {
    return tasks().list.filter(function (t) { return t.owner === owner && t.state === "ready"; }).length;
  }

  function renderTabs() {
    ["tabs"].forEach(function (hostId) {
      var host = document.getElementById(hostId); host.innerHTML = "";
      TABS.forEach(function (tb) {
        var b = document.createElement("button");
        b.className = "tab " + tb.cls + (currentView === tb.id ? " on" : "");
        b.innerHTML = '<span class="ic">' + tb.ic + '</span><span>' + tb.label + '</span>';
        if (tb.id !== "map") {
          var n = readyCount(tb.id);
          if (n) b.innerHTML += '<span class="bdg num" style="--bc:' + tb.bc + '">' + n + '</span>';
        }
        b.addEventListener("click", function () { switchView(tb.id); });
        host.appendChild(b);
      });
    });
  }
  function switchView(id) {
    currentView = id;
    document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("on"); });
    document.getElementById("view-" + id).classList.add("on");
    renderTabs();
    if (id === "map") renderMap();
  }

  /* ---------- progress (per-line segments) ---------- */
  function renderProgress() {
    var host = document.getElementById("progress"); host.innerHTML = "";
    var T = tasks().list;
    seed.tracks.forEach(function (tr) {
      var mine = T.filter(function (t) { return t.track === tr.id; });
      var done = mine.filter(function (t) { return t.status === "done"; }).length;
      var seg = document.createElement("div"); seg.className = "seg";
      seg.title = tr.name + " — " + done + "/" + mine.length;
      seg.innerHTML = '<i style="--c:' + tr.color + '"></i>';
      host.appendChild(seg);
      requestAnimationFrame(function () { seg.firstChild.style.width = (mine.length ? Math.round(done / mine.length * 100) : 0) + "%"; });
    });
  }

  /* ---------- person views ---------- */
  var doneOpen = {}; LANES.forEach(function (l) { doneOpen[l.id] = false; });

  function cardHTML(t, opts) {
    var tr = trackById[t.track] || { color: "var(--ink-faint)" };
    var cls = "card is-" + t.state + (opts && opts.justUnblocked ? " just-unblocked" : "");
    var ringCls = "ring" + (t.owner === "ext" && t.state === "ready" ? " ext-wait" : "");
    var meta = '<span class="lchip" style="--tc:' + tr.color + '">' + esc(tr.name) + '</span>';
    if (t.doing && t.state !== "done") meta += '<span class="doing">in flight</span>';
    if (t.priority === "high" && t.state === "ready") meta += '<span class="pri-hi">HIGH</span>';
    if (t.state === "blocked") {
      var names = t.blockers.slice(0, 2).map(function (b) { var bt = tasks().byId[b]; return bt ? bt.title : b; });
      var more = t.blockers.length > 2 ? " +" + (t.blockers.length - 2) : "";
      meta = '<span class="blockedby">waiting on <b>' + esc(names.join("</b>, <b>")) + '</b>' + more + '</span>';
    }
    var ref = t.ref ? '<a class="ref" href="' + esc(t.ref.href) + '"' + (/^https?:/.test(t.ref.href) ? ' target="_blank"' : "") + '>↗ ' + esc(t.ref.label) + '</a>' : "";
    var burst = "";
    for (var i = 0; i < 8; i++) {
      var a = i / 8 * Math.PI * 2;
      burst += '<i style="--dx:' + Math.round(Math.cos(a) * 26) + 'px;--dy:' + Math.round(Math.sin(a) * 26) + 'px"></i>';
    }
    return '<article class="' + cls + '" data-id="' + esc(t.id) + '" style="--tc:' + tr.color + '">' +
      '<span class="rail"></span>' +
      '<button class="' + ringCls + '" aria-label="' + (t.status === "done" ? "Reopen" : "Complete") + ": " + esc(t.title) + '"><span class="c">✓</span><span class="burst">' + burst + '</span></button>' +
      '<div class="card-main">' +
        '<div class="card-title">' + esc(t.title) + '</div>' +
        (t.detail ? '<div class="card-detail">' + esc(t.detail) + '</div>' : "") +
        '<div class="card-meta">' + meta + ref + '</div>' +
      '</div></article>';
  }

  function renderPerson(owner, unblockIds) {
    var host = document.getElementById("view-" + owner);
    var T = tasks().list;
    var mine = T.filter(function (t) { return t.owner === owner; });
    // ext ("world") tasks surface on the world-lane's plate — that person is the interface to the world
    var isWorldLane = owner === WORLD_LANE.id;
    var ext = isWorldLane ? T.filter(function (t) { return t.owner === "ext" && t.status !== "done"; }) : [];
    var up = mine.filter(function (t) { return t.state === "ready"; })
      .sort(function (a, b) { return (b.doing ? 1 : 0) - (a.doing ? 1 : 0) || prio(b) - prio(a); });
    var waiting = mine.filter(function (t) { return t.state === "blocked"; }).concat(ext);
    var done = mine.filter(function (t) { return t.status === "done"; })
      .concat(isWorldLane ? T.filter(function (t) { return t.owner === "ext" && t.status === "done"; }) : []);
    var lane = laneById[owner] || { name: owner, subtitle: "" };
    var who = lane.name || lane.label || owner;
    var sub = lane.subtitle || "";

    var extReady = ext.filter(function (t) { return t.state === "ready"; });
    var waitingSorted = waiting.sort(function (a, b) {
      var ea = a.owner === "ext" && a.state === "ready" ? 1 : 0, eb = b.owner === "ext" && b.state === "ready" ? 1 : 0;
      return eb - ea;
    });

    var h = '<div class="plate-head"><h2>' + who + '</h2><span class="sub">' + sub + '</span></div>';

    h += '<div class="sect"><div class="sect-head up"><span class="t">Up now</span><span class="n num">' + up.length + '</span></div>';
    h += up.length ? up.map(function (t) { return cardHTML(t, { justUnblocked: unblockIds && unblockIds.indexOf(t.id) !== -1 }); }).join("")
                   : '<div class="empty-note">' + (mine.every(function (t) { return t.status === "done"; }) ? "All clear 🎉" : "Nothing actionable — waiting on upstream ⏳") + '</div>';
    h += '</div>';

    h += '<div class="sect"><div class="sect-head"><span class="t">Waiting</span><span class="n num">' + waitingSorted.length + '</span></div>';
    h += waitingSorted.length ? waitingSorted.map(function (t) { return cardHTML(t); }).join("") : '<div class="empty-note">Nothing blocked</div>';
    h += '</div>';

    h += '<div class="sect"><div class="sect-head"><span class="t">Done</span><span class="n num">' + done.length + '</span>' +
         '<button class="tgl" data-tgl="' + owner + '">' + (doneOpen[owner] ? "hide" : "show") + '</button></div>';
    if (doneOpen[owner]) h += done.map(function (t) { return cardHTML(t); }).join("");
    h += '</div>';

    h += '<div style="display:flex;gap:10px;margin:6px 0 12px"><button class="hd-btn" data-add="' + owner + '" style="flex:1">+ Add a task</button></div>';

    host.innerHTML = h;

    host.querySelectorAll(".ring").forEach(function (r) {
      r.addEventListener("click", function () { toggleTask(r.closest(".card").dataset.id, r); });
    });
    host.querySelectorAll("[data-tgl]").forEach(function (b) {
      b.addEventListener("click", function () { doneOpen[owner] = !doneOpen[owner]; renderPerson(owner); });
    });
    host.querySelectorAll("[data-add]").forEach(function (b) {
      b.addEventListener("click", function () { openAdd(owner); });
    });
  }
  function prio(t) { return t.priority === "high" ? 2 : t.priority === "medium" ? 1 : 0; }

  /* ---------- toggle + unblock magic ---------- */
  function toggleTask(id, ringEl) {
    var before = tasks();
    var t = before.byId[id]; if (!t) return;
    var wasReadyBefore = before.list.filter(function (x) { return x.state === "ready"; }).map(function (x) { return x.id; });

    var newStatus = t.status === "done" ? "open" : "done";
    var seedTask = seed.tasks.filter(function (s) { return s.id === id; })[0];
    if (seedTask && seedTask.status === newStatus) delete deltas.statusOverride[id];
    else deltas.statusOverride[id] = newStatus;
    var added = deltas.added.filter(function (a) { return a.id === id; })[0];
    if (added) added.status = newStatus;
    saveDeltas();

    if (newStatus === "done" && ringEl) {
      var card = ringEl.closest(".card");
      card.classList.add("popping");
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
    }

    var after = tasks();
    var nowReady = after.list.filter(function (x) { return x.state === "ready" && wasReadyBefore.indexOf(x.id) === -1; });
    var msg;
    if (newStatus === "done") {
      msg = "✓ " + t.title;
      if (nowReady.length) msg += '<br><span class="un">🔓 unblocked: ' + nowReady.map(function (x) { return esc(x.title); }).join(" · ") + "</span>";
      if (id === TERMINUS_ID) msg = cfg.terminusMessage || ("🎉🎉 " + t.title + " 🎉🎉");
    } else msg = "↺ reopened " + t.title;
    toast(msg);

    setTimeout(function () {
      renderAll(nowReady.map(function (x) { return x.id; }));
    }, newStatus === "done" ? 450 : 60);
  }

  /* ---------- map: network (SVG metro) + line diagrams ---------- */
  var mapHandle = null;
  var lastWrap = 0;
  // Overview (fit) uses ONE row of lanes — short + wide, so fit-both lands at the largest scale
  // and the whole map fits on screen. Zoom uses a 3-wide grid on phones so 1:1 reading isn't a
  // 6-lane-wide horizontal scroll.
  function netWrap() { return (netMode === "zoom" && (window.innerWidth || 800) < 760) ? 3 : 0; }
  function switchNetMode(mode, focusId) {
    netMode = mode;
    if (mapHandle) { mapHandle.destroy && mapHandle.destroy(); mapHandle = null; }
    document.getElementById("netHost").innerHTML = "";
    renderNetwork();
    if (mode === "zoom" && focusId && mapHandle && mapHandle.focus) mapHandle.focus(focusId);
  }
  var mapView = "network"; // "network" | "lines"
  try { mapView = localStorage.getItem(MAPVIEWKEY) || "network"; } catch (e) {}
  var netMode = "fit"; // "fit" = overview w/ keyword labels; "zoom" = 1:1 w/ full labels
  function mapData() {
    var T = tasks();
    return {
      tracks: seed.tracks.map(function (tr) { return { id: tr.id, name: tr.name, color: cssColor(tr.color, tr.hex) }; }),
      tasks: T.list.map(function (t) { return { id: t.id, title: t.title, short: t.short, owner: t.owner, status: t.status, track: t.track, deps: t.deps || [], priority: t.priority, terminus: !!t.terminus }; })
    };
  }
  function cssColor(varStr, fallback) {
    try {
      var mm = String(varStr).match(/var\((--[a-z-]+)\)/i);
      if (mm) { var v = getComputedStyle(document.documentElement).getPropertyValue(mm[1]).trim(); if (v) return v; }
    } catch (e) {}
    return fallback || varStr;
  }
  function netTheme() {
    var cs = getComputedStyle(document.documentElement);
    function v(n) { return cs.getPropertyValue(n).trim(); }
    var ownerColors = { ext: v("--ext") }; ownerColors[LANE_A.id] = v("--lane-a"); ownerColors[LANE_B.id] = v("--lane-b");
    var ownerGlyphs = { ext: EXT.glyph }; ownerGlyphs[LANE_A.id] = LANE_A.glyph; ownerGlyphs[LANE_B.id] = LANE_B.glyph;
    return { bg: v("--bg"), ink: v("--ink"), dim: v("--ink-faint"), halo: v("--halo"),
             ownerColors: ownerColors, ownerGlyphs: ownerGlyphs };
  }
  function applyNetMode() {
    var host = document.getElementById("netHost");
    var svg = host.querySelector("svg"); if (!svg) return;
    var w = parseFloat(svg.getAttribute("width")) || 0;
    var h = parseFloat(svg.getAttribute("height")) || 0;
    if (netMode === "fit" && w && h) {
      // Fit the WHOLE graph on screen — both axes. Measure the room from the VIEWPORT, not
      // from netHost (its width is polluted by the overflowing svg, which made scale read ~1).
      var vw = document.documentElement.clientWidth || window.innerWidth;
      var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
      var top = host.getBoundingClientRect().top; if (top < 0) top = 0;
      var availW = vw - 8;
      var availH = Math.max(300, vh - top - 14);   // leftover screen height below the controls
      var sc = Math.min(availW / w, availH / h, 1); // never upscale past 1:1
      svg.style.transformOrigin = "0 0";
      svg.style.transform = "scale(" + sc + ")";
      svg.style.marginLeft = Math.max(0, (availW - w * sc) / 2) + "px"; // center the scaled map
      host.style.height = Math.ceil(h * sc) + "px";
      host.style.overflow = "hidden";
      host.classList.add("fitted");
    } else {
      svg.style.transform = "";
      svg.style.marginLeft = "";
      host.style.height = "";
      host.style.overflow = "";
      host.style.overflowX = "auto";
      host.classList.remove("fitted");
    }
    var zb = document.getElementById("netZoomBtn");
    if (zb) zb.textContent = netMode === "fit" ? "🔍 Zoom in" : "⤢ Fit all";
    var hint = document.getElementById("mapHint");
    if (hint) hint.textContent = mapView === "lines"
      ? "Tap a disc to mark it done · ⛓ chips jump to the blocking station"
      : (netMode === "fit" ? "Whole map on one screen · tap any station to zoom in and read it" : "Tap a station to mark it done · ⤢ Fit all zooms back out");
  }
  function renderNetwork() {
    var host = document.getElementById("netHost");
    if (!window.BoardMap) { host.innerHTML = '<div class="empty-note" style="margin:10px 14px">map engine missing</div>'; return; }
    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (mapHandle) { mapHandle.update(mapData()); applyNetMode(); return; }
    lastWrap = netWrap();
    mapHandle = window.BoardMap.render(host, mapData(), {
      wrapCols: lastWrap,
      onTap: function (id) {
        if (netMode === "fit") switchNetMode("zoom", id);
        else toggleTask(id, null);
      },
      reducedMotion: reduced,
      theme: netTheme()
    });
    applyNetMode();
  }
  function renderMap(unblockIds) {
    var engine = !!window.BoardMap;
    var sw = document.querySelector(".map-switch-row");
    if (sw) sw.style.display = engine ? "" : "none";
    var net = engine && mapView === "network";
    document.getElementById("netHost").style.display = net ? "" : "none";
    document.getElementById("linesHost").style.display = net ? "none" : "";
    document.getElementById("netZoomBtn").style.display = net ? "" : "none";
    document.querySelectorAll("#mapSwitch button").forEach(function (b) { b.classList.toggle("on", b.dataset.mv === mapView); });
    if (net) renderNetwork(); else renderLines(unblockIds);
    applyNetMode();
  }
  document.getElementById("netZoomBtn").addEventListener("click", function () {
    switchNetMode(netMode === "fit" ? "zoom" : "fit");
  });
  document.querySelectorAll("#mapSwitch button").forEach(function (b) {
    b.addEventListener("click", function () {
      mapView = b.dataset.mv;
      try { localStorage.setItem(MAPVIEWKEY, mapView); } catch (e) {}
      renderMap();
    });
  });
  window.addEventListener("resize", function () {
    if (currentView !== "map" || mapView !== "network") return;
    if (netWrap() !== lastWrap && mapHandle) { mapHandle.destroy && mapHandle.destroy(); mapHandle = null; document.getElementById("netHost").innerHTML = ""; renderNetwork(); }
    else applyNetMode();
  });

  function renderLines(unblockIds) {
    var host = document.getElementById("linesHost");
    var T = tasks();
    var sy = window.scrollY;
    var h = "";
    seed.tracks.forEach(function (tr) {
      var sts = T.list.filter(function (t) { return t.track === tr.id; });
      var done = sts.filter(function (t) { return t.status === "done"; }).length;
      var here = null;
      for (var i = 0; i < sts.length; i++) { if (sts[i].status !== "done") { here = sts[i]; break; } }
      h += '<section class="line-block" style="--tc:' + tr.color + '">';
      h += '<div class="line-head"><span class="nm">' + esc(tr.name) + '</span><span class="prog num">' + done + "/" + sts.length + (here ? " · next: " + esc(here.title) : " · line clear ✓") + '</span></div>';
      sts.forEach(function (t) {
        var isTerm = t.id === TERMINUS_ID;
        var cls = "stn is-" + t.state + (t.owner === "ext" ? " is-ext" : "") + (here && t.id === here.id ? " here" : "") + (isTerm ? " terminus" : "") + (unblockIds && unblockIds.indexOf(t.id) !== -1 ? " flash" : "");
        var oc = t.owner === "ext" ? "var(--ext)" : t.owner === LANE_A.id ? "var(--lane-a)" : t.owner === LANE_B.id ? "var(--lane-b)" : "var(--ink-faint)";
        var og = t.owner === "ext" ? EXT.label : (laneById[t.owner] ? laneById[t.owner].glyph : t.owner);
        var glyph = t.state === "done" ? "✓" : t.state === "blocked" ? "🔒" : t.owner === "ext" ? "⧗" : "";
        var chips = "";
        (t.deps || []).forEach(function (d) {
          var dt = T.byId[d]; if (!dt || dt.status === "done" || dt.track === t.track) return;
          var dtr = trackById[dt.track] || {};
          chips += '<button class="depchip" data-jump="' + esc(d) + '" style="--dc:' + (dtr.color || "var(--ink-faint)") + '">⛓ ' + esc(dt.title) + '</button>';
        });
        h += '<div class="' + cls + '" data-stn="' + esc(t.id) + '"><span class="seg"></span>' +
          '<button class="disc" aria-label="' + esc(t.title) + " — " + (t.state === "done" ? "done, tap to reopen" : t.state === "ready" ? "ready, tap to complete" : "blocked") + '"><span class="d">' + glyph + '</span></button>' +
          '<div class="body">' +
            (isTerm ? '<div class="conv" aria-hidden="true">' + seed.tracks.map(function (x) { return '<i style="--c:' + x.color + '"></i>'; }).join("") + '</div>' : "") +
            '<span class="t">' + esc(t.title) + '</span><span class="own" style="--oc:' + oc + '">' + og + '</span>' +
            (chips ? '<div class="depchips">' + chips + '</div>' : "") +
          '</div></div>';
      });
      h += '</section>';
    });
    host.innerHTML = h;
    host.querySelectorAll(".disc").forEach(function (b) {
      b.addEventListener("click", function () { toggleTask(b.closest(".stn").dataset.stn, null); });
    });
    host.querySelectorAll(".depchip").forEach(function (c) {
      c.addEventListener("click", function () {
        var el = host.querySelector('.stn[data-stn="' + c.dataset.jump + '"]');
        if (el) {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
          el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
        }
      });
    });
    window.scrollTo(0, sy);
  }

  /* ---------- sync ---------- */
  function syncBadge() {
    document.getElementById("syncBtn").classList.toggle("sync-live", !!isDirty());
  }
  function syncPayload() {
    var doneIds = [], reopenedIds = [];
    Object.keys(deltas.statusOverride).forEach(function (id) {
      (deltas.statusOverride[id] === "done" ? doneIds : reopenedIds).push(id);
    });
    return JSON.stringify({
      kind: BID + "-board-sync", rev: seed.rev, at: new Date().toISOString(),
      done: doneIds, reopened: reopenedIds, added: deltas.added, removed: deltas.removed
    }, null, 1);
  }
  function openSync() {
    var dirty = isDirty();
    var body;
    if (!dirty) {
      body = '<h3>In sync ✓</h3><p style="color:var(--ink-dim);font-size:13px;margin:0 0 6px">This device matches the committed board. Tap rings or stations to plan — changes save here instantly and show up in Sync to hand off.</p>' +
             '<div class="acts"><button class="quiet" data-x>Close</button></div>';
    } else {
      body = '<h3>Sync back to the seed</h3>' +
        '<p style="color:var(--ink-dim);font-size:13px;margin:0 0 10px">Your taps are saved on this device only. To make them permanent, copy this payload and apply it to the seed — hand it to your coding agent, or edit the seed by hand (see README).</p>' +
        '<div class="f"><textarea class="syncbox" readonly id="syncBox">' + esc(syncPayload()) + '</textarea></div>' +
        '<div class="acts"><button class="quiet" data-x>Close</button>' +
        (window.claude && window.claude.downloads ? '<button class="quiet" data-dl>Save file</button>' : "") +
        '<button class="go" data-copy>Copy</button></div>' +
        '<div class="acts"><button class="quiet" data-reset style="color:#FF6B6B">Discard local changes</button></div>';
    }
    sheet(body, function (el) {
      el.querySelectorAll("[data-x]").forEach(function (b) { b.addEventListener("click", closeSheet); });
      var c = el.querySelector("[data-copy]");
      if (c) c.addEventListener("click", function () {
        var txt = syncPayload();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(function () { closeSheet(); toast("Copied — apply it to the seed 📋"); },
            function () { var b2 = document.getElementById("syncBox"); b2.select(); toast("Select + copy the text above"); });
        } else { var b3 = document.getElementById("syncBox"); b3.select(); toast("Select + copy the text above"); }
      });
      var d = el.querySelector("[data-dl]");
      if (d) d.addEventListener("click", function () {
        window.claude.downloads.save({ filename: BID + "-board-sync.json", data: syncPayload() })
          .then(function () { toast("Saved 📄"); })
          .catch(function (err) { if (err && err.code !== "declined") toast("Couldn't save — use Copy instead"); });
      });
      var r = el.querySelector("[data-reset]");
      if (r) r.addEventListener("click", function () {
        deltas = { statusOverride: {}, added: [], removed: [] }; saveDeltas(); closeSheet(); renderAll(); toast("Back to the committed board");
      });
    });
  }

  /* ---------- add task ---------- */
  function openAdd(owner) {
    var trackOpts = seed.tracks.map(function (tr) { return '<option value="' + tr.id + '">' + esc(tr.name) + '</option>'; }).join("");
    var depOpts = '<option value="">— none, actionable now —</option>' + tasks().list
      .filter(function (t) { return t.status !== "done"; })
      .map(function (t) { return '<option value="' + esc(t.id) + '">' + esc(t.title) + '</option>'; }).join("");
    sheet('<h3>New task — ' + esc((laneById[owner] || {}).name || owner) + '</h3>' +
      '<div class="f"><label>Title</label><input id="nt-title" placeholder="What needs doing?" /></div>' +
      '<div class="f"><label>Detail</label><input id="nt-detail" placeholder="Context (optional)" /></div>' +
      '<div class="row2"><div class="f"><label>Line</label><select id="nt-track">' + trackOpts + '</select></div>' +
      '<div class="f"><label>Priority</label><select id="nt-pri"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div></div>' +
      '<div class="f"><label>Blocked by</label><select id="nt-dep">' + depOpts + '</select></div>' +
      '<div class="acts"><button class="quiet" data-x>Cancel</button><button class="go" data-save>Add</button></div>',
      function (el) {
        el.querySelector("[data-x]").addEventListener("click", closeSheet);
        el.querySelector("[data-save]").addEventListener("click", function () {
          var title = el.querySelector("#nt-title").value.trim(); if (!title) return;
          var dep = el.querySelector("#nt-dep").value;
          deltas.added.push({
            id: "u-" + Date.now().toString(36), title: title, owner: owner, status: "open",
            track: el.querySelector("#nt-track").value, deps: dep ? [dep] : [],
            priority: el.querySelector("#nt-pri").value,
            detail: el.querySelector("#nt-detail").value.trim()
          });
          saveDeltas(); closeSheet(); renderAll(); toast("Added — hit Sync when you want it committed");
        });
        setTimeout(function () { el.querySelector("#nt-title").focus(); }, 60);
      });
  }

  /* ---------- sheet + toast plumbing ---------- */
  function sheet(html, wire) {
    var s = document.getElementById("sheet"); s.innerHTML = html;
    document.getElementById("scrim").classList.add("show");
    if (wire) wire(s);
  }
  function closeSheet() { document.getElementById("scrim").classList.remove("show"); }
  document.getElementById("scrim").addEventListener("click", function (e) { if (e.target.id === "scrim") closeSheet(); });

  var toastTimer;
  function toast(html) {
    var t = document.getElementById("toast"); t.innerHTML = html; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }

  /* ---------- theme ---------- */
  function applyTheme(mode) {
    if (mode) document.documentElement.setAttribute("data-theme", mode);
    else document.documentElement.removeAttribute("data-theme");
    try { mode ? localStorage.setItem(THEME, mode) : localStorage.removeItem(THEME); } catch (e) {}
    if (mapHandle) { mapHandle.destroy && mapHandle.destroy(); mapHandle = null; }
    var nh = document.getElementById("netHost"); if (nh) nh.innerHTML = "";
    if (currentView === "map") renderMap();
  }
  document.getElementById("themeBtn").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
    applyTheme(cur ? (cur === "dark" ? "light" : "dark") : (prefersLight ? "dark" : "light"));
  });
  document.getElementById("syncBtn").addEventListener("click", openSync);

  /* ---------- boot ---------- */
  function renderAll(unblockIds) {
    renderPerson(LANE_A.id, unblockIds); renderPerson(LANE_B.id, unblockIds);
    renderTabs(); renderProgress(); syncBadge();
    if (currentView === "map") renderMap(unblockIds);
  }
  try { var savedTheme = localStorage.getItem(THEME); if (savedTheme) applyTheme(savedTheme); } catch (e) {}
  renderAll();
  switchView(LANE_A.id);
})();
</script>
</body>
</html>
