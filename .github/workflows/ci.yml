# Quality gate for the Mission Control board — runs the zero-dependency invariant harness
# on every push and PR. Only becomes active once this folder is the root of its own repo
# (GitHub only runs workflows under the repo-root .github/workflows/).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: Board — seed invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/smoke.js
